name: EAS CI/CD & Auto Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build a fresh standalone Android APK file?'
        required: true
        type: boolean
        default: false

jobs:
  ota_update:
    name: 🚀 Push Over-The-Air Auto Update
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Install Dependencies
        run: npm install

      - name: 🚀 Publish Instant OTA Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --branch preview --auto --non-interactive

  build_apk:
    name: 📱 Build Android APK (Free GitHub Runner)
    needs: ota_update
    if: github.event.inputs.build_apk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Install Dependencies
        run: npm install

      - name: ⚙️ Generate Native Android Code
        run: npx expo prebuild --platform android --no-install

      - name: 🔨 Make Gradle Executable
        run: chmod +x android/gradlew

      - name: 📦 Compile Standalone Android APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
